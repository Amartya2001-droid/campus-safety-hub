name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm run ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - run: backend/.venv/bin/python -m pip check
      - run: backend/.venv/bin/python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: node --import tsx --test scripts/campus-backend.test.mjs
      - run: npm run test:smoke
      - run: node scripts/backend-smoke.mjs
        env:
          PYTHON: backend/.venv/bin/python
      - run: npm ci && npm run build
        working-directory: functions
